# .github/workflows/build.yml
name: Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 4 * * 1'   # wöchentlich: neueste PHP-Patches übernehmen
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Ohne Cache bauen (Sicherheits-Update)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true                      # Base-Image immer frisch (neuester PHP-Patch)
          no-cache: ${{ inputs.no_cache == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: PHP-Version im Image ausgeben
        run: docker run --rm --entrypoint php ${{ fromJSON(steps.meta.outputs.json).tags[0] }} -v

      - name: Keine Secrets im Frontend-Bundle
        run: |
          docker create --name bundle ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker cp bundle:/var/www/html/public/build ./bundle
          ! grep -rEi "sk-|api[_-]?key|secret" ./bundle

      # Optional: Coolify nach erfolgreichem Push anstossen (Repo-Variable AUTO_DEPLOY=true).
      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
        run: |
          # COOLIFY_WEBHOOK = "Deploy Webhook" der Ressource: https://<coolify>/api/v1/deploy?uuid=<uuid>&force=false
          # Neuere Coolify-Versionen akzeptieren dafür nur noch POST.
          # COOLIFY_TOKEN   = API-Token (Keys & Tokens) mit Recht "deploy"; die API muss in Coolify aktiviert sein
          curl -sS --fail-with-body --retry 2 -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json"
