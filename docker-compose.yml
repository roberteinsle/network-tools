# Lokale Entwicklung / Codespaces: App + Worker + Scheduler + Postgres, Code per Bind-Mount.
#   docker compose up -d --build
#   docker compose exec app php artisan app:user du@example.com   # Anmeldelink ausgeben
x-dev-env: &dev-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_DATABASE: domainmonitor
  DB_USERNAME: domainmonitor
  DB_PASSWORD: domainmonitor
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "360"
  PHP_OPCACHE_ENABLE: "0"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      <<: *dev-env
      AUTORUN_ENABLED: "true"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=1", "--timeout=320"]
    environment:
      <<: *dev-env
      AUTORUN_ENABLED: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      - app

  scheduler:
    build: .
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *dev-env
      AUTORUN_ENABLED: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domainmonitor
      POSTGRES_USER: domainmonitor
      POSTGRES_PASSWORD: domainmonitor
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domainmonitor"]
      interval: 5s
      retries: 10

volumes:
  db-data:
